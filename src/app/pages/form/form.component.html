	<!-- modify this form HTML and place wherever you want your form -->
	<form
		class="flex flex-col"
		action="https://formspree.io/f/xpwovzkl"
		method="POST"
	>
		<label class="w-full flex flex-col mb-4">
			Your email:
			<input type="email" name="email">
		</label>
		<label class="w-full flex flex-col mb-4">
			Your message:
			<textarea name="message"></textarea>
		</label>
		<!-- your other form fields go here -->
		<button type="submit" class="btn btn-success">Send</button>
	</form>


	<div *ngIf="submitted" class="mt-4 p-3 rounded-md bg-green-50 text-green-700">
		Grazie! Il form è stato inviato.
	</div>
</div>
